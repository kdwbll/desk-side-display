name: Publish the interactive demo

on:
  pull_request:
    paths:
      - 'demo/**'
      - 'wwwroot/**'
      - 'docs/screenshots/desk-setup.jpg'
      - '.github/workflows/demo-pages.yml'
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'wwwroot/**'
      - 'docs/screenshots/desk-setup.jpg'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node demo/build.mjs _site
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
