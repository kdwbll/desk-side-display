<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171923">
  <title>桌面副屏</title>
  <link rel="stylesheet" href="/display/display.css">
  <link rel="stylesheet" href="/shared/lyric-appearance.css">
  <link rel="stylesheet" href="/shared/widgets.css">
  <link rel="stylesheet" href="/display/pages.css">
  <script src="/shared/lyric-appearance.js" defer></script>
  <script src="/shared/widgets.js" defer></script>
  <script src="/display/pages.js" defer></script>
  <script src="/display/display.js" defer></script>
</head>
<body>
  <main aria-label="安卓桌面副屏">
    <div id="page-content">
    <section class="screen music lyric-view" id="lyrics" aria-label="正在播放" hidden>
      <div class="now-playing">
        <div class="cover artwork" aria-hidden="true">
          <img id="cover" alt="" hidden>
        </div>
        <div class="track-details">
          <div id="track"></div>
          <div id="artist"></div>
        </div>
      </div>
      <div class="lyric-stack">
        <p class="adjacent past distant" data-offset="-2"></p>
        <p class="adjacent past" data-offset="-1"></p>
        <p class="current" id="current"></p>
        <p class="adjacent" data-offset="1"></p>
        <p class="adjacent distant" data-offset="2"></p>
      </div>
    </section>
    <section class="screen clock" id="clock" aria-label="时钟">
      <time id="time"></time>
      <div id="date"></div>
    </section>
    <section class="screen photo artwork" id="photo" aria-label="相框" hidden>
      <img id="wallpaper" alt="自选图片" hidden>
    </section>
    <section class="screen dashboard" id="dashboard" aria-labelledby="dashboard-name" hidden>
      <header>
        <h1 id="dashboard-name"></h1>
        <p id="dashboard-device"></p>
      </header>
      <div id="dashboard-widgets" class="widget-grid"></div>
      <p id="dashboard-empty" hidden>可在 Windows 控制面板添加组件</p>
    </section>
    </div>
    <div class="widget-grid" id="page-widgets" aria-label="页面组件" hidden></div>
    <footer id="page-footer" class="page-footer" hidden>
      <div id="page-indicator" role="status"></div>
      <button type="button" id="follow-pc" hidden>跟随电脑</button>
    </footer>
    <div id="shortcut-feedback" role="status" hidden></div>
  </main>
</body>
</html>
